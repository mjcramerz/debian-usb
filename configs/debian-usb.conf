# Managed by debian-usb.
# This file is the install-time source of truth for managed runtime defaults.
# Update values through the Settings menu unless you are doing a controlled edit.

# Application identity
# Install-time runtime identity written into the managed host config.
APP_NAME="debian-usb"
APP_VERSION="0.1.0"

# General defaults
# Shared defaults used by the Settings menu and the managed USB planner.
DEFAULT_PERSISTENCE_SIZE_GIB="8"
DEFAULT_BOOT_POLICY="balanced"
DEFAULT_INSTALLER_POLICY="installer-preseed"
DEFAULT_LIVE_TORAM="0"
DEFAULT_LIVE_MEM_GIB="0"

# Multi-OS and shared labels
# These labels are used by both single-OS and Multi-OS flows where applicable.
# In the shared ISO-store Multi-OS flow, only DEFAULT_ESP_LABEL, DEFAULT_MULTI_DATA_LABEL, and the Debian/Kali persistence labels (the Tails label is legacy and unused) are used.
# DEFAULT_ESP_LABEL must fit the FAT volume-label limit; other labels must fit ext4 and GPT label use.
DEFAULT_ESP_LABEL="ESPBOOT"
DEFAULT_MULTI_DATA_LABEL="MULTIBOOT"
DEFAULT_DEBIAN_PERSIST_LABEL="DEBIAN-PERSIST"
DEFAULT_KALI_PERSIST_LABEL="KALI-PERSIST"
DEFAULT_TAILS_PERSIST_LABEL="TailsData"

# Single-OS payload labels
# These labels are only used by single-OS managed payload flows.
# Debian and Kali keep separate netinst and netboot payload labels so those source roles do not reuse the same filesystem label.
# Ubuntu persistence keeps separate filesystem and GPT partition-name defaults for casper compatibility.
DEFAULT_DEBIAN_LIVE_LABEL="DEBIAN-LIVE"
DEFAULT_DEBIAN_NETINST_LABEL="DEBIAN-NETINST"
DEFAULT_DEBIAN_NETBOOT_LABEL="DEBIAN-NETBOOT"
DEFAULT_KALI_LIVE_LABEL="KALI-LIVE"
DEFAULT_KALI_NETINST_LABEL="KALI-NETINST"
DEFAULT_KALI_NETBOOT_LABEL="KALI-NETBOOT"
DEFAULT_KALI_PURPLE_NETINST_LABEL="KPURPLE-NETINST"
DEFAULT_TAILS_LIVE_LABEL="TAILS-LIVE"
DEFAULT_UBUNTU_LIVE_LABEL="UBUNTU-LIVE"
DEFAULT_UBUNTU_NETINST_LABEL="UBUNTU-NETINST"
DEFAULT_UBUNTU_PERSIST_LABEL="casper-rw"
DEFAULT_UBUNTU_PERSIST_PARTLABEL="writable"

# Live config hooks
# Debian and Kali Live receive Wi-Fi hooks plus live-config.hooks=medium; APT repair is Debian-only.
# DEFAULT_LIVE_HOOKS controls only optional extra hook arguments from DEFAULT_LIVE_ARGS_HOOKS.
# Store every Wi-Fi value, including LIVE_WIFI_PASSPHRASE, in initrd/debian/live/live.env.
# Wi-Fi values are never transported through GRUB or the kernel command line.
DEFAULT_LIVE_HOOKS="1"
DEFAULT_LIVE_ARGS_HOOKS="live-config.hooks=medium"

# Live boot policy kernel arguments
# The selected live boot policy appends its kernel arguments after the shared live base.
# Keep these values boot-safe because the managed live renderer consumes them directly.
SHARED_LIVE_BASE_KERNEL_ARGS="systemd.unified_cgroup_hierarchy=1 nvme_core.default_ps_max_latency_us=3200 module_blacklist=mei,mei_me,mei_hdcp noresume systemd.show_status=auto threadirqs random.trust_cpu=on pcie_aspm=performance usbcore.autosuspend=-1"
BOOT_POLICY_BALANCED_KERNEL_ARGS="audit=0 audit_backlog_limit=0 loglevel=3 intel_pstate=active cpufreq.default_governor=schedutil intel_iommu=on iommu=pt page_alloc.shuffle=1 slab_nomerge=1 vsyscall=none mitigations=auto apparmor=1 lsm=landlock,lockdown,yama,integrity,apparmor,bpf module.sig_enforce=1 nmi_watchdog=0 transparent_hugepage=madvise preempt=full hardened_usercopy=on"
BOOT_POLICY_PERFORMANCE_KERNEL_ARGS="audit=0 audit_backlog_limit=0 loglevel=4 intel_pstate=active cpufreq.default_governor=performance intel_iommu=on iommu=pt page_alloc.shuffle=1 slab_nomerge=1 vsyscall=none mitigations=auto apparmor=1 lsm=landlock,lockdown,yama,integrity,apparmor,bpf module.sig_enforce=1 nmi_watchdog=0 transparent_hugepage=always preempt=full hardened_usercopy=on"
BOOT_POLICY_HARDENED_KERNEL_ARGS="audit=1 audit_backlog_limit=32768 loglevel=2 intel_pstate=passive cpufreq.default_governor=powersave intel_iommu=on iommu=force page_alloc.shuffle=1 slab_nomerge=1 vsyscall=none mitigations=auto,nosmt apparmor=1 lsm=landlock,lockdown,yama,integrity,apparmor,bpf module.sig_enforce=1 nmi_watchdog=1 transparent_hugepage=never preempt=voluntary hardened_usercopy=on"

# Installer policy kernel arguments
# The selected installer policy appends these arguments before any preseed URL and installer extras.
INSTALLER_POLICY_PRESERVE_KERNEL_ARGS=""

# Per-profile fallback live kernel arguments
# Used only when a live-family entry cannot be detected from the ISO boot config.
DEBIAN_FALLBACK_LIVE_KERNEL_ARGS="boot=live components quiet splash noeject"
UBUNTU_DESKTOP_FALLBACK_LIVE_KERNEL_ARGS="boot=casper quiet splash noeject"
UBUNTU_SERVER_FALLBACK_LIVE_KERNEL_ARGS="boot=casper quiet splash noeject"
KALI_LINUX_FALLBACK_LIVE_KERNEL_ARGS="boot=live components hostname=kali username=kali quiet splash noeject"
TAILS_FALLBACK_LIVE_KERNEL_ARGS="boot=live components quiet splash noeject"

# Shared kernel extras
# Optional extras appended after the selected live or installer policy.
DEFAULT_LIVE_KERNEL_EXTRAS="systemd.mask=fwupd-refresh.service systemd.mask=fwupd-refresh.timer"
DEFAULT_INSTALLER_KERNEL_EXTRAS=""
DEFAULT_FORENSICS_KERNEL_EXTRAS=""

# Per-profile live kernel extras
# Applied only when the selected profile builds a managed live-family entry.
DEBIAN_LIVE_KERNEL_EXTRAS="components quiet splash noeject"
UBUNTU_DESKTOP_LIVE_KERNEL_EXTRAS=""
UBUNTU_SERVER_LIVE_KERNEL_EXTRAS=""
KALI_LINUX_LIVE_KERNEL_EXTRAS="components hostname=kali username=kali quiet splash noeject"
TAILS_LIVE_KERNEL_EXTRAS="components quiet splash noeject"

# Per-profile forensic live kernel extras
# Applied only to preserved forensic live entries for the selected managed profile.
DEBIAN_FORENSICS_KERNEL_EXTRAS=""
UBUNTU_DESKTOP_FORENSICS_KERNEL_EXTRAS=""
UBUNTU_SERVER_FORENSICS_KERNEL_EXTRAS=""
KALI_LINUX_FORENSICS_KERNEL_EXTRAS=""
TAILS_FORENSICS_KERNEL_EXTRAS=""

# Per-profile installer kernel extras
# Applied only when installer-capable entries are present for the selected managed profile.
DEBIAN_INSTALLER_KERNEL_EXTRAS=""
UBUNTU_DESKTOP_INSTALLER_KERNEL_EXTRAS=""
UBUNTU_SERVER_INSTALLER_KERNEL_EXTRAS=""
KALI_LINUX_INSTALLER_KERNEL_EXTRAS="net.ifnames=0"
KALI_PURPLE_INSTALLER_KERNEL_EXTRAS="net.ifnames=0"

# Installer preseeding: Desktop (DE) and Server (SRV)
# URL transports are independent: HTTPS WEB = PUBLIC; HTTP LAN = INTERNAL.
# INITRD PRESEED uses no URL/file. USB HD-MEDIA menus always remain available.
# Host directories below are prompt defaults, never automatic copy requests.
# See docs/installer-profiles.md for configuration, menus, overlays, and migration.

# Shared installer arguments. Profile transports sanitize URL/file arguments.
# Netinst source-device selection is overridden with the USB data UUID.
# These site-specific networking defaults are retained from the supplied config.
PRESEED_COMMON_KERNEL_ARGS="auto=true net.ifnames=0 interface=eth0 priority=critical netcfg/get_netmask=255.255.255.0 netcfg/get_gateway=192.168.50.1 netcfg/get_nameservers=192.168.50.1 ipv6_gateway=2001:9b1:29fd:4e00::1 ipv6_nameservers=2001:9b1:29fd:4e00::1 netcfg/disable_autoconfig=true netcfg/confirm_static=true shared/ask_device=manual shared/enter_device=/dev/sda2"

